; Copie este arquivo para %APPDATA%\YouTubeStudioDelphi\config.ini
; (o app cria esse arquivo vazio na primeira execução) e preencha com as
; credenciais do cliente OAuth criado no Google Cloud Console.
; Nunca grave este arquivo preenchido dentro da pasta do projeto.

[Google]
ClientID=SEU_CLIENT_ID.apps.googleusercontent.com
Secret=SEU_CLIENT_SECRET
CallBackURL=http://127.0.0.1:8888/
